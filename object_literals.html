<body>
    <script>
        let n = "name";

        let student = {
            [n]: "dhruv sharma",
            ["First" + n]: "dhruv",
            ["Last" + n]: "sharma"
        };

        console.log("full name: " + student.name);
        console.log("first name: " + student.Firstname);
        console.log("last name: " + student.Lastname);



    </script>
