<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern 2</title>
    <script>
        function pattern2() {
            const n = parseInt(prompt("Enter the number of rows:"), 10);
            let pattern = "";
            for (let i = 0; i <= (2*n - 1); i++) {
                if (i < n) {
                    for (let j = 0; j < i + 1; j++) {
                        pattern += "* ";
                    }
                } else {
                    for (let j = 0; j < 2*n - i - 1; j++) {
                        pattern += "* ";
                    }
                }
                pattern += "<br>";
            }
            document.getElementById("output").innerHTML = pattern;
        }
    </script>
</head>
<body>
    <div id="output"></div>
    <button onclick="pattern2()">Display Pattern</button>
</body>
</html>
