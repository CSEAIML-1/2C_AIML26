<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student-OOPS</title>
</head>
<body>

<script>
    let student = {
        name: "Dhruv Kumar Sharma",
        id: 3045,
        city: "Ghaziabad",

        learning: function() {
            console.log("TECH SUBJECTS");
        },

        greet: function() {
            console.log(`Hello, my name is ${this.name} and my ID is ${this.id}.`);
        }
    };

    student.pincode = 201001;

    student.yoga = function() {
        console.log("I am doing yoga");
    };

    student.learning();
    student.greet();
    student.yoga();

    console.log(student);


    class Student {
        constructor(id, name, city) {
            this.id = id;
            this.name = name;
            this.city = city;
        }

        studentDetails() {
            console.log(`ID: ${this.id}`);
            console.log(`Name: ${this.name}`);
            console.log(`City: ${this.city}`);
        }
    }

    let s1 = new Student(101, "Vikas", "Ghaziabad");
    let s2 = new Student(102, "Dhruv", "Noida");

    s1.studentDetails();
    s2.studentDetails();

    console.log(s1);
    console.log(s2);
</script>

</body>
</html>
