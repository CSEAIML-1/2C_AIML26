<body>
    <h2>Javascript Array Functions</h2>

    <button onclick="displayArray()">Display Array</button>
    <div id="arrayOutput"></div>



    <script>

        function displayArray() {

            let  a = [24, 25, 26, 27, 28, 29];
        document.getElementById("arrayOutput").innerHTML = "Initial Array: " + a.join(", ");

        a.push(30);
        document.getElementById("arrayOutput").innerHTML += "<br>After push(30): " + a.join(", ");

        a.push(31, 32);
        document.getElementById("arrayOutput").innerHTML += "<br>After push(31, 32): " + a.join(", ");

        a.pop();
        document.getElementById("arrayOutput").innerHTML += "<br>After pop(): " + a.join(", ");

        let b = a.slice(2, 5);
        document.getElementById("arrayOutput").innerHTML += "<br>Sliced Array: " + b.join(", ");

        let combinedArrays = a.concat(b);
        document.getElementById("arrayOutput").innerHTML += "<br>Combined Arrays: " + combinedArrays.join(", ");
