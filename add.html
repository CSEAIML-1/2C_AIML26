<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addition using JS</title>
    <style>
        body {
            background-color: rgb(187, 252, 255);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        button {
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            border: solid 1px rgb(0, 4, 88);
            border-radius: 5px;
            color: white;
            font-size: 20px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
    <script>
        function sum(){
            let  a = 10;
            let b = 20;
            let c = a + b;
            document.write(c);
        }
    </script>
</head>
<body>
    <button onclick="sum()">Calculate Sum</button>

</body>
</html>
