<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OOPS</title>
</head>
<body>
    <script>
        class student{
            constructor(name){
                this.name = name;
                console.log(this.name);
            }

            info(){
                console.log("student information");
                console.log(this.name);
            }

            static name = "static function!!!";

            static display(){
                console.log(student.name);
            }
        };

        let s1 = new student();
        s1.info();
        let s2 = new student("constructor called !!!");
        student.display();
    </script>
</body>
</html>
