<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function</title>
    <style>
        body {
            background-color: rgb(187, 252, 255);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        button {
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            border: solid 1px rgb(0, 4, 88);
            border-radius: 20px;
            color: white;
            font-size: 20px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
    <script>
        function F(fn){
            let FN = fn;
            return FN;
        }
        function L(ln){
            let LN = ln;
            return LN;
        }
        function Name(){
            let FirstName = F("Dhruv");
            let LastName = L("Sharma");
            document.write("My name is " + FirstName + " " + LastName);
        }
    </script>
</head>
<body>
    <button onclick="Name()">Display Name</button>
    
</body>
</html>
